[package]
name = "terencher-core"
version = "0.1.0"
edition = "2021"
description = "Core domain + SQLite persistence for the Terencher Android app"
license = "MIT"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
